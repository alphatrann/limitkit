<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="#fdfdfd" stroke="#e5e7eb"/>
  <text x="28" y="34" font-size="15" font-weight="600" fill="#111827">Where the telemetry goes</text>

  <rect x="28" y="66" width="150" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="103" y="92" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">limiter.consume()</text>
  <text x="103" y="110" font-size="9.5" fill="#6b7280" text-anchor="middle">this example's Express route</text>

  <rect x="228" y="66" width="150" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="303" y="92" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">OtelObserver</text>
  <text x="303" y="110" font-size="9.5" fill="#6d28d9" text-anchor="middle">@limitkit/otel</text>

  <rect x="428" y="66" width="170" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="513" y="88" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">OpenTelemetry SDK</text>
  <text x="513" y="106" font-size="9.5" fill="#6b7280" text-anchor="middle">TracerProvider ·</text>
  <text x="513" y="118" font-size="9.5" fill="#6b7280" text-anchor="middle">MeterProvider (telemetry.ts)</text>

  <rect x="648" y="66" width="184" height="64" rx="10" fill="#eef6ff" stroke="#3b82f6"/>
  <text x="740" y="88" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">an exporter</text>
  <text x="740" y="106" font-size="9.5" fill="#1d4ed8" text-anchor="middle">console here — swap for</text>
  <text x="740" y="118" font-size="9.5" fill="#1d4ed8" text-anchor="middle">OTLP or Prometheus</text>

  <g stroke="#6b7280" stroke-width="1.6" marker-end="url(#af)">
    <line x1="178" y1="98" x2="224" y2="98"/>
    <line x1="378" y1="98" x2="424" y2="98"/>
    <line x1="598" y1="98" x2="644" y2="98"/>
  </g>

  <text x="303" y="150" font-size="9.5" fill="#6b7280" text-anchor="middle">one span per call,</text>
  <text x="303" y="162" font-size="9.5" fill="#6b7280" text-anchor="middle">a child span per rule, plus metrics</text>

  <line x1="740" y1="130" x2="740" y2="184" stroke="#6b7280" stroke-width="1.6" marker-end="url(#af)"/>

  <rect x="150" y="188" width="560" height="86" rx="10" fill="#fafafa" stroke="#d1d5db"/>
  <text x="430" y="210" font-size="11.5" font-weight="600" fill="#374151" text-anchor="middle">Your backend</text>
  <text x="430" y="232" font-size="10" fill="#6b7280" text-anchor="middle">Prometheus + Grafana for the dashboards ·</text>
  <text x="430" y="248" font-size="10" fill="#6b7280" text-anchor="middle">Tempo, Jaeger, Datadog, or Honeycomb for the traces</text>
  <text x="430" y="264" font-size="9" fill="#9ca3af" text-anchor="middle">LimitKit never talks to any of these directly — only to the SDK.</text>
</svg>
