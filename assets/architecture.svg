<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="355" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="32" y="38" font-size="16" font-weight="650" fill="#1f2937">How the packages fit together</text>
  <text x="32" y="59" font-size="11" fill="#6b7280">core is the only package you always need.</text>

  <!-- core -->
  <rect x="308" y="176" width="204" height="78" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="211" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">@limitkit/core</text>
  <text x="410" y="232" font-size="10.5" fill="#6366f1" text-anchor="middle">the engine</text>

  <!-- adapters -->
  <rect x="278" y="78" width="264" height="70" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="294" y="98" font-size="10" font-weight="700" letter-spacing="0.6" fill="#b45309">ADAPTERS</text>
  <rect x="294" y="108" width="122" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="355" y="127" font-size="10" fill="#1f2937" text-anchor="middle">@limitkit/express</text>
  <rect x="424" y="108" width="104" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="127" font-size="10" fill="#1f2937" text-anchor="middle">@limitkit/nest</text>

  <!-- stores -->
  <rect x="44" y="144" width="206" height="164" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="166" font-size="10" font-weight="700" letter-spacing="0.6" fill="#0f766e">STORES</text>
  <rect x="60" y="176" width="174" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="147" y="197" font-size="10.5" fill="#1f2937" text-anchor="middle">@limitkit/memory</text>
  <rect x="60" y="216" width="174" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="147" y="237" font-size="10.5" fill="#1f2937" text-anchor="middle">@limitkit/redis</text>
  <rect x="60" y="256" width="174" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="147" y="277" font-size="10.5" fill="#1f2937" text-anchor="middle">@limitkit/postgres</text>

  <!-- integrations -->
  <rect x="570" y="144" width="206" height="124" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="586" y="166" font-size="10" font-weight="700" letter-spacing="0.6" fill="#6d28d9">INTEGRATIONS</text>
  <rect x="586" y="176" width="174" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="673" y="197" font-size="10.5" fill="#1f2937" text-anchor="middle">@limitkit/ai</text>
  <rect x="586" y="216" width="174" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="673" y="237" font-size="10.5" fill="#1f2937" text-anchor="middle">@limitkit/otel</text>

  <!-- connectors -->
  <g stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)">
    <line x1="410" y1="148" x2="410" y2="174"/>
    <line x1="250" y1="215" x2="306" y2="215"/>
    <line x1="570" y1="215" x2="514" y2="215"/>
  </g>

  <text x="410" y="334" font-size="10.5" fill="#6b7280" text-anchor="middle">Every connection is an interface — swap any piece without touching the rest.</text>
</svg>
