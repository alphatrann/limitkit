<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="209" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="38" font-size="16" font-weight="650" fill="#1f2937">One consume() call</text>

  <rect x="32" y="64" width="104" height="54" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="84" y="96" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">context</text>

  <rect x="176" y="64" width="132" height="54" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="242" y="96" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">RateLimiter</text>

  <rect x="348" y="64" width="120" height="54" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="408" y="89" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">each rule</text>
  <text x="408" y="106" font-size="9" fill="#6b7280" text-anchor="middle">key · policy · cost</text>

  <rect x="508" y="64" width="100" height="54" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="558" y="96" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">store</text>

  <rect x="648" y="64" width="140" height="54" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="718" y="89" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">result</text>
  <text x="718" y="106" font-size="9" fill="#6366f1" text-anchor="middle">the decision</text>

  <g stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ap)">
    <line x1="136" y1="91" x2="172" y2="91"/>
    <line x1="308" y1="91" x2="344" y2="91"/>
    <line x1="468" y1="91" x2="504" y2="91"/>
    <line x1="608" y1="91" x2="644" y2="91"/>
  </g>

  <text x="410" y="150" font-size="10.5" fill="#6b7280" text-anchor="middle">Rules run in order — the first to reject wins.</text>

  <line x1="242" y1="118" x2="242" y2="160" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ap)"/>
  <text x="252" y="142" font-size="9" fill="#8b5cf6">events</text>

  <rect x="176" y="160" width="176" height="38" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="264" y="184" font-size="11.5" font-weight="600" fill="#5b21b6" text-anchor="middle">Observers</text>
  <text x="372" y="184" font-size="9.5" fill="#6b7280">logging · metrics · tracing</text>
</svg>
