<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#fdfdfd" stroke="#e5e7eb"/>
  <text x="28" y="36" font-size="15" font-weight="600" fill="#111827">One consume() call</text>

  <!-- flow boxes -->
  <g>
    <rect x="28" y="70" width="118" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="87" y="98" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">context</text>
    <text x="87" y="116" font-size="10" fill="#6b7280" text-anchor="middle">the request</text>

    <rect x="196" y="70" width="150" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="271" y="98" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">RateLimiter</text>
    <text x="271" y="116" font-size="10" fill="#6b7280" text-anchor="middle">walks the rules</text>

    <rect x="396" y="70" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="481" y="94" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">each rule</text>
    <text x="481" y="112" font-size="10" fill="#6b7280" text-anchor="middle">resolve key · policy · cost</text>
    <text x="481" y="124" font-size="10" fill="#6b7280" text-anchor="middle">then ask the store</text>

    <rect x="616" y="70" width="110" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="671" y="98" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">store</text>
    <text x="671" y="116" font-size="10" fill="#6b7280" text-anchor="middle">counts quota</text>

    <rect x="776" y="70" width="80" height="60" rx="10" fill="#eef6ff" stroke="#3b82f6"/>
    <text x="816" y="94" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">result</text>
    <text x="816" y="112" font-size="9.5" fill="#1d4ed8" text-anchor="middle">allowed?</text>
    <text x="816" y="124" font-size="9.5" fill="#1d4ed8" text-anchor="middle">failedRule</text>
  </g>

  <!-- arrows -->
  <g stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="146" y1="100" x2="192" y2="100"/>
    <line x1="346" y1="100" x2="392" y2="100"/>
    <line x1="566" y1="100" x2="612" y2="100"/>
    <line x1="726" y1="100" x2="772" y2="100"/>
  </g>

  <text x="481" y="156" font-size="10.5" fill="#6b7280" text-anchor="middle">rules run in order — the first one to reject stops the chain</text>

  <!-- observers branch -->
  <line x1="271" y1="130" x2="271" y2="216" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="286" y="180" font-size="10.5" fill="#7c3aed">emits a lifecycle event at every step</text>

  <rect x="196" y="216" width="330" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="361" y="240" font-size="12.5" font-weight="600" fill="#4c1d95" text-anchor="middle">Observers</text>
  <text x="361" y="258" font-size="10" fill="#6d28d9" text-anchor="middle">logging · metrics · tracing — never block the decision</text>

  <text x="612" y="244" font-size="10.5" fill="#6b7280">A thrown observer handler is isolated,</text>
  <text x="612" y="260" font-size="10.5" fill="#6b7280">so telemetry can't break rate limiting.</text>
</svg>
