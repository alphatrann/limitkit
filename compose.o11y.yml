# Local observability stack for exercising @limitkit/otel by hand.
#
# NOT run by CI — `compose.test.yml` stays limited to Redis + Postgres. Bring
# this up when you want to see spans in Jaeger and metrics in Grafana:
#
#   docker compose -f compose.o11y.yml up -d
#
# Point an OpenTelemetry SDK at the collector (OTLP http://localhost:4318) or
# scrape the SDK's Prometheus exporter directly. Then:
#   - Jaeger UI:     http://localhost:16686
#   - Prometheus:    http://localhost:9090
#   - Grafana:       http://localhost:3000  (anonymous admin; import
#                    packages/integrations/observability/grafana-dashboard.json)
name: limitkit-o11y
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: limitkit-jaeger
    ports:
      - '16686:16686' # web UI
      - '14268:14268' # collector (HTTP, jaeger.thrift)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: limitkit-otel-collector
    command: ['--config=/etc/otel-collector.yaml']
    volumes:
      - ./dev/o11y/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus exporter (scraped by prometheus)
    depends_on:
      - jaeger
      - loki

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: limitkit-prometheus
    volumes:
      - ./dev/o11y/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:3.0.0
    container_name: limitkit-loki
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '3100:3100'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: limitkit-grafana
    volumes:
      - ./dev/o11y/grafana-datasources.yml:/etc/grafana/provisioning/datasources/limitkit.yml:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - jaeger
